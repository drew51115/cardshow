[build]
  publish = "."
  functions = "netlify/functions"

# Supabase anon/publishable keys are intentionally public — they are safe
# to commit per Supabase's security model (RLS governs access, not key secrecy).
# Tell Netlify's secrets scanner to ignore this well-known public-key prefix.
[secrets_scanning]
  enabled = true
  ignore_patterns = [
    "sb_publishable_",
    "qtnqawqlmttogwnjieky"
  ]

# Disable pretty URLs globally — prevents Netlify from redirecting
# show.html → /show which strips the URL hash fragment containing
# the show inventory payload.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false
