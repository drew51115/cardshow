[build]
  # Substitute Supabase credentials from Netlify environment variables into HTML files.
  # Set SUPABASE_URL and SUPABASE_ANON_KEY in Netlify dashboard → Site settings → Environment variables.
  command = "sed -i \"s|SUPABASE_URL_PLACEHOLDER|$SUPABASE_URL|g\" app.html show.html seller-browse.html && sed -i \"s|SUPABASE_ANON_KEY_PLACEHOLDER|$SUPABASE_ANON_KEY|g\" app.html show.html seller-browse.html"
  publish = "."
  functions = "netlify/functions"

# Disable pretty URLs globally — prevents Netlify from redirecting
# show.html → /show which strips the URL hash fragment containing
# the show inventory payload.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false
